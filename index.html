<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="1er Challenge Échecs et Vins du Val de Loire — 10 et 11 avril 2027 à Chinon.">
  <title>Échecs & Vins du Val de Loire — 1er Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #18232a;
      --wine: #762b32;
      --wine-dark: #4f1d23;
      --cream: #f5efe3;
      --paper: #fffdf8;
      --gold: #b58a4a;
      --blue: #24485b;
      --muted: #6f746f;
      --line: rgba(24,35,42,.14);
      --shadow: 0 22px 70px rgba(30,24,18,.13);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .19em;
      font-size: .72rem;
      font-weight: 700;
      color: var(--wine);
    }
    h1,h2,h3 { font-family: "Cormorant Garamond", Georgia, serif; line-height: .98; margin: 0; }
    h2 { font-size: clamp(2.6rem, 6vw, 4.8rem); }
    p { margin: 0; }

    header {
      position: absolute;
      inset: 0 0 auto;
      z-index: 10;
      color: #fff;
    }
    nav {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.2);
    }
    .brand {
      display: flex; gap: 10px; align-items: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.5rem; font-weight: 700;
    }
    .brand-mark { font-size: 1.45rem; }
    .nav-links { display: flex; gap: 28px; font-size: .84rem; }
    .nav-links a { opacity: .88; transition: opacity .2s; }
    .nav-links a:hover { opacity: 1; }
    .nav-cta {
      padding: 11px 17px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 999px;
    }

    .hero {
      min-height: 760px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 78% 18%, rgba(181,138,74,.35), transparent 28%),
        linear-gradient(115deg, rgba(29,44,50,.97), rgba(79,29,35,.88));
    }
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 62px 62px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }
    .hero::after {
      content: "♟";
      position: absolute;
      right: 8vw;
      bottom: -60px;
      font-family: Georgia, serif;
      font-size: min(52vw, 620px);
      line-height: 1;
      color: rgba(255,255,255,.035);
      transform: rotate(-7deg);
    }
    .hero-inner {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 1.1fr .9fr;
      gap: 70px; align-items: center;
      padding: 110px 0 70px;
    }
    .hero h1 {
      font-size: clamp(3.2rem, 6vw, 5.5rem);
      letter-spacing: -.02em;
      max-width: 800px;
    }
    .hero h1 span { color: #e0bd7d; }
    .hero-sub {
      margin-top: 25px; max-width: 600px;
      font-size: 1.04rem; color: rgba(255,255,255,.78);
    }
    .hero-meta {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin: 30px 0;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.07);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: .82rem;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 21px; border-radius: 999px;
      font-weight: 700; font-size: .9rem;
      transition: transform .2s, background .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: #d4ad6a; color: #231d17; }
    .btn-ghost { border: 1px solid rgba(255,255,255,.32); color: white; }
    .poster {
      width: min(100%, 410px);
      justify-self: end;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,.34);
      transform: rotate(2deg);
      border: 8px solid rgba(255,255,255,.92);
      background: #fff;
    }

    /* Zone spécifique pour l'intégration propre des deux logos */
    .hero-logos {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 20px;
    }
    .hero-logos img {
      height: 65px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.2));
    }

    section { padding: 110px 0; }
    .intro {
      background: var(--cream);
    }
    .intro-grid {
      display: grid; grid-template-columns: .8fr 1.2fr;
      gap: 70px; align-items: start;
    }
    .intro-copy { font-size: 1.14rem; color: #4f5655; max-width: 720px; }
    .facts {
      margin-top: 28px;
      display: grid; grid-template-columns: repeat(2, 1fr);
      border-top: 1px solid var(--line);
    }
    .fact { padding: 20px 12px 20px 0; border-bottom: 1px solid var(--line); }
    .fact strong { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.8rem; }
    .fact small { color: var(--muted); }
    .program { background: var(--paper); }
    .program-head { display: flex; justify-content: space-between; gap: 30px; align-items: end; margin-bottom: 45px; }
    .program-head p { max-width: 420px; color: var(--muted); }
    .timeline { border-top: 1px solid var(--line); }
    .row {
      display: grid; grid-template-columns: 170px 1fr auto;
      gap: 28px; padding: 25px 0; border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .time { font-weight: 700; color: var(--wine); }
    .row h3 { font-size: 1.8rem; }
    .row p { color: var(--muted); font-size: .9rem; }
    .badge { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: .75rem; white-space: nowrap; }

    .location {
      color: white;
      background: var(--blue);
    }
    .location-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center;
    }
    .location .eyebrow { color: #dfbd7c; }
    .location h2 { margin: 10px 0 24px; }
    .address { font-size: 1.05rem; color: rgba(255,255,255,.75); }
    .map-card {
      min-height: 330px; border-radius: var(--radius);
      background:
        linear-gradient(rgba(36,72,91,.1), rgba(36,72,91,.1)),
        repeating-linear-gradient(35deg, rgba(255,255,255,.09) 0 1px, transparent 1px 24px);
      border: 1px solid rgba(255,255,255,.15);
      display: grid; place-items: center;
      position: relative; overflow: hidden;
    }
    .map-pin {
      width: 64px; height: 64px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); background: #d4ad6a;
      display: grid; place-items: center;
    }
    .map-pin::after { content: "♟"; transform: rotate(45deg); color: var(--blue); font-size: 1.5rem; }

    .register { background: var(--wine-dark); color: white; }
    .register-box {
      display: grid; grid-template-columns: 1fr .7fr; gap: 50px;
      align-items: center; padding: 55px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px; background: rgba(255,255,255,.045);
    }
    .register h2 { margin: 10px 0 18px; }
    .register p { color: rgba(255,255,255,.7); max-width: 610px; }
    .capacity {
      text-align: center; padding: 30px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 20px;
    }
    .capacity strong { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-size: 4rem; color: #dfbd7c; line-height: 1; }
    .capacity span { color: rgba(255,255,255,.65); }

    footer {
      background: #151b1e; color: rgba(255,255,255,.62);
      padding: 30px 0; font-size: .8rem;
    }
    .footer-inner { display: flex; justify-content: space-between; gap: 20px; }
    footer strong { color: white; font-family: "Cormorant Garamond", Georgia, serif; }

    @media (max-width: 880px) {
      .hero-inner, .intro-grid, .location-grid, .register-box { grid-template-columns: 1fr; gap: 40px; }
      .poster { justify-self: center; }
      .nav-links, .nav-cta { display: none; }
      nav { height: 70px; }
      .row { grid-template-columns: 1fr; gap: 10px; }
      .badge { justify-self: start; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <span class="brand-mark">♟</span> Échecs & Vins de Loire
        </div>
        <div class="nav-links">
          <a href="#challenge">Le challenge</a>
          <a href="#programme">Programme</a>
          <a href="#lieu">Le lieu</a>
          <a href="#inscription" class="nav-cta">S'inscrire</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="container">
        <div class="hero-inner">
          <div class="hero-content">
            <!-- Ajout des deux logos demandés en haut -->
            <div class="hero-logos">
              <img src="assets/logo-club-avoine.png" alt="Logo Club d’échecs d'Avoine">
              <img src="assets/logo-auberge-rois.png" alt="Logo L'Auberge des Rois">
            </div>
            
            <!-- Texte organisateur modifié -->
